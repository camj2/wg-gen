[package]
name = "wg-rs"
version = "0.1.0"
description = "Generate WireGuard config files."
authors = ["Cameron Jackson <dev@camj.me>"]
repository = "https://git.camj.me/wireguard"
license = "MIT"
edition = "2024"

[[bin]]
name = "wg-gen"
path = "src/bin/main.rs"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0"
simply_colored = "0.1"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.3"
wireguard-keys = "0.1.1"
